{% extends "base.html" %}
{% block title %}修改密码 · MySQL HA 管理器{% endblock %}
{% block content %}
<div class="page-head">
  <h1>修改密码</h1>
  <p>修改登录管理平台的账号密码。</p>
</div>

<div class="card" style="max-width:480px">
  <form method="post" action="/change_password">
    <div class="form-row">
      <label>当前密码</label>
      <input type="password" name="current_password" placeholder="请输入当前密码" required>
    </div>
    <div class="form-row">
      <label>新密码</label>
      <input type="password" name="new_password" placeholder="请输入新密码（≥6 位）" required minlength="6">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn btn-primary">确认修改</button>
    </div>
  </form>
</div>
{% endblock %}
