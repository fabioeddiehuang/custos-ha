{% extends "base.html" %}
{% block title %}修改密码 · MySQL HA 管理器{% endblock %}
{% block content %}
<style>
  .pwd-card{max-width:460px}
  .pwd-card .field+.field{margin-top:16px}
</style>

{% if msg %}<div class="banner ok">✓ {{ msg }}</div>{% endif %}
{% if error %}<div class="banner err">⚠ {{ error }}</div>{% endif %}

<div class="card pwd-card">
  <h3>修改密码</h3>
  <form method="post" action="/change_password">
    <div class="field">
      <label>原密码</label>
      <input type="password" name="old_password" required autocomplete="current-password">
    </div>
    <div class="field">
      <label>新密码</label>
      <input type="password" name="new_password" required minlength="6" autocomplete="new-password">
      <div class="hint">至少 6 位，建议包含字母、数字与特殊字符</div>
    </div>
    <div class="field">
      <label>确认新密码</label>
      <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary">保存</button>
      <a class="btn" href="/" style="text-decoration:none;">取消</a>
    </div>
  </form>
</div>
{% endblock %}
