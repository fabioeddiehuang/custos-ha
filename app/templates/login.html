<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Custos</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/v3.css">
  <script>
    // 主题：尽早应用，避免首屏闪白（与内页 base.html 保持一致）
    (function(){
      try{
        var t = localStorage.getItem('custos-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <style>
    /* ============================================================
       登录页 —— 全宽分栏（取消原先的圆角卡片遮罩，改为铺满视口）
       配色令牌跟随主题：默认暗色，[data-theme="light"] 覆盖为浅色。
       主色沿用品牌渐变 #22d3ee → #0ABAB5（蒂凡尼青）。
       ============================================================ */
    :root{
      --lp-bg:#070b14; --lp-bg-2:#0e1830; --lp-bg-3:#0a1222;
      --lp-ink:#e8eefc; --lp-muted:#8b9ac0;
      --lp-line:rgba(255,255,255,.10);
      --lp-surface:rgba(255,255,255,.045);
      --lp-input:rgba(255,255,255,.05);
      --lp-input-focus:rgba(255,255,255,.085);
      --lp-ink-strong:#04121a;              /* 主按钮上的深墨字 */
      --lp-glow-a:rgba(10,186,181,.22);     /* 左上：青 */
      --lp-glow-b:rgba(124,45,82,.30);      /* 右下：紫酱红 */
      --lp-grid:rgba(255,255,255,.035);
      --lp-watermark:.055;
      --accent:#0ABAB5; --accent-2:#22d3ee; --plum:#7C2D52;
    }
    html[data-theme="light"]{
      --lp-bg:#eaf0fa; --lp-bg-2:#ffffff; --lp-bg-3:#f4f7fd;
      --lp-ink:#0f172a; --lp-muted:#5a6b8c;
      --lp-line:rgba(15,23,42,.10);
      --lp-surface:rgba(255,255,255,.75);
      --lp-input:rgba(15,23,42,.035);
      --lp-input-focus:#ffffff;
      --lp-ink-strong:#04121a;
      --lp-glow-a:rgba(10,186,181,.18);
      --lp-glow-b:rgba(124,45,82,.13);
      --lp-grid:rgba(15,23,42,.040);
      --lp-watermark:.07;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--lp-ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    /* ---------- 全宽分栏容器 ---------- */
    .auth{
      position:relative; min-height:100vh;
      display:grid; grid-template-columns:1.02fr .98fr;
      background-image:
        radial-gradient(880px 520px at 10% 6%,   var(--lp-glow-a), transparent 60%),
        radial-gradient(760px 500px at 92% 96%,  var(--lp-glow-b), transparent 62%),
        linear-gradient(140deg, var(--lp-bg) 0%, var(--lp-bg-2) 55%, var(--lp-bg-3) 100%);
      background-attachment:fixed;
    }
    /* 细网格底纹：中心亮、四周渐隐 */
    .auth::before{
      content:""; position:absolute; inset:0; pointer-events:none; opacity:.6;
      background-image:
        linear-gradient(var(--lp-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--lp-grid) 1px, transparent 1px);
      background-size:46px 46px;
      -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
              mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    }

    /* ---------- 左：品牌区 ---------- */
    .brand-side{
      position:relative; z-index:1;
      padding:clamp(34px,4.6vw,72px);
      display:flex; flex-direction:column; justify-content:center;
      border-right:1px solid var(--lp-line);
      overflow:hidden;
    }
    /* 竖向光带分隔线：全高分栏的中缝，替代圆角卡片边框 */
    .brand-side::after{
      content:""; position:absolute; top:10%; right:-1px; bottom:10%; width:1px;
      background:linear-gradient(180deg, transparent, var(--accent-2), var(--accent), transparent);
      opacity:.5;
    }
    /* 巨型水印 Logo：低透明，纯装饰 */
    .brand-wm{
      position:absolute; right:-64px; bottom:-84px; width:400px; height:400px;
      opacity:var(--lp-watermark); pointer-events:none;
    }
    .brand-wm svg{width:100%;height:100%;display:block}

    .lockup{display:flex; align-items:center; gap:18px}
    .mark{
      width:clamp(60px,5.4vw,76px); height:clamp(60px,5.4vw,76px); flex:none;
      filter:drop-shadow(0 12px 30px rgba(10,186,181,.34));
    }
    .mark svg{width:100%;height:100%;display:block}

    .wordmark{
      font-size:clamp(30px,3.1vw,42px); font-weight:800;
      letter-spacing:.20em; line-height:1; white-space:nowrap;
    }
    .tagline{
      margin-top:9px; font-size:12.5px; letter-spacing:.16em;
      color:var(--lp-muted); font-weight:500;
    }

    .side-title{
      margin:38px 0 12px; font-size:clamp(22px,2.3vw,30px);
      line-height:1.45; font-weight:800; letter-spacing:.5px;
    }
    .side-title em{
      font-style:normal;
      background:linear-gradient(90deg,var(--accent-2),var(--accent));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .side-sub{color:var(--lp-muted);font-size:13.5px;line-height:1.9;margin:0 0 26px;max-width:44ch}

    .feat{display:grid;gap:13px;margin:0;padding:0;list-style:none}
    .feat li{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--lp-ink);opacity:.88}
    .feat .dot{
      width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      box-shadow:0 0 0 4px rgba(10,186,181,.14);
    }

    /* ---------- 右：表单区 ---------- */
    .form-side{
      position:relative; z-index:1;
      display:flex; align-items:center; justify-content:center;
      padding:clamp(28px,4vw,64px);
    }
    .form-box{width:100%; max-width:376px}
    .form-box h1{margin:0 0 7px;font-size:23px;font-weight:800;letter-spacing:.3px}
    .form-box .sub{margin:0 0 26px;color:var(--lp-muted);font-size:13px}

    /* 陷阱备忘：v3.css 的 .field 是设置页「标签左/控件右」的行式 flex，
       登录页必须改回块级上下排布，否则 label 被挤成窄列、文字竖排换行。 */
    .form-box .field{display:block;padding:0;border-bottom:0;margin-bottom:16px}
    .form-box .field label{
      display:block;font-size:12px;color:var(--lp-muted);
      margin-bottom:7px;font-weight:600;white-space:nowrap;
    }
    .form-box .field input{
      width:100%;padding:12px 14px;border-radius:11px;font-size:14px;color:var(--lp-ink);
      background:var(--lp-input);border:1px solid var(--lp-line);outline:none;transition:.18s;
    }
    .form-box .field input::placeholder{color:var(--lp-muted);opacity:.6}
    .form-box .field input:focus{
      border-color:rgba(34,211,238,.65);background:var(--lp-input-focus);
      box-shadow:0 0 0 4px rgba(10,186,181,.16);
    }
    .submit{
      width:100%;padding:12px 14px;border:0;border-radius:11px;cursor:pointer;margin-top:6px;
      font-size:14.5px;font-weight:800;letter-spacing:2px;color:var(--lp-ink-strong);
      background:linear-gradient(135deg,var(--accent-2),var(--accent));
      box-shadow:0 12px 30px rgba(10,186,181,.28);transition:.18s;
    }
    .submit:hover{transform:translateY(-1px);box-shadow:0 16px 36px rgba(10,186,181,.38)}
    .submit:active{transform:translateY(0)}
    .banner.err{
      background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.35);color:#fecaca;
      border-radius:11px;padding:10px 12px;margin-bottom:18px;font-size:13px;
    }

    @media (max-width:920px){
      .auth{grid-template-columns:1fr}
      .brand-side{display:none}
      .form-side{padding:40px 24px}
    }
  </style>
</head>
<body>

<!-- ===== Logo：已定稿 8 号（轨道环 · 天蓝），与内页侧边栏共用 ===== -->
{% include "_logos.html" %}

<div class="auth">
  <!-- ============ 左：品牌 ============ -->
  <aside class="brand-side">
    <!-- 水印（装饰） -->
    <span class="brand-wm" aria-hidden="true">
      <svg viewBox="0 0 32 32"><use href="#cs-logo-8" id="wmUse"/></svg>
    </span>

    <div class="lockup">
      <span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#cs-logo-8" id="markUse"/></svg></span>
      <div>
        <div class="wordmark">CUSTOS</div>
        <div class="tagline">Never let your database down</div>
      </div>
    </div>

    <h2 class="side-title">为数据库<br><em>永不中断</em>而设计</h2>
    <p class="side-sub">主库故障秒级切换、复制自愈、配置巡检，一套后台托管 MySQL / MariaDB 高可用集群。</p>

    <ul class="feat">
      <li><span class="dot"></span><span>秒级故障切换 · VIP 自动漂移</span></li>
      <li><span class="dot"></span><span>复制中断 / 配置漂移 自动自愈</span></li>
      <li><span class="dot"></span><span>多集群统一观测与告警中心</span></li>
    </ul>


  </aside>

  <!-- ============ 右：登录表单 ============ -->
  <main class="form-side">
    <div class="form-box">
      <h1>欢迎回来</h1>
      <p class="sub">请登录以管理高可用集群</p>

      {% if error %}<div class="banner err">⚠ {{ error }}</div>{% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" type="text" name="username" placeholder="admin" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit">登 录</button>
      </form>
    </div>
  </main>
</div>


</body>
</html>
