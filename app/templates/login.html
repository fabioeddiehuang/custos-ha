<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · MySQL HA 管理器</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="logo">◈</span><span class="brand-text">MySQL HA 管理器</span></div>
      <h1>欢迎回来</h1>
      <p class="sub">请登录以管理高可用集群</p>

      {% if error %}<div class="banner err" style="margin-bottom:16px">⚠ <div>{{ error }}</div></div>{% endif %}

      <form method="post" action="/login">
        <div class="form-row">
          <label>用户名</label>
          <input type="text" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="form-row">
          <label>密码</label>
          <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="btn-row" style="margin-top:4px">
          <button type="submit" class="btn btn-primary" style="width:100%">登 录</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
