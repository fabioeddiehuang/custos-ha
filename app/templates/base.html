<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MySQL 高可用管理平台{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/v3.css">
</head>
<body>
<div class="app">
  <!-- 左菜单（v3 · 浅色紫调） -->
  <aside class="sidebar">
    <div class="brand"><span class="logo">◈</span><div><b>MySQL HA</b><small>高可用管理平台</small></div></div>
    <nav class="side">
      <a class="nav1" href="/" data-path="/"><span class="ic">◧</span>仪表盘</a>
      <div class="nav-group" id="navClusterGroup">
        <a class="nav1" href="/clusters" data-path="/clusters"><span class="ic">▦</span>集群管理<span class="caret" onclick="toggleCluster(event)">▶</span></a>
        <div class="sub" id="clusterSub"><!-- 由 /api/status 动态填充 --></div>
      </div>
      <a class="nav1" href="/nodes" data-path="/nodes"><span class="ic">⛁</span>节点管理</a>
      <a class="nav1" href="/alerts" data-path="/alerts"><span class="ic">✦</span>告警设置</a>
      <a class="nav1" href="/settings" data-path="/settings"><span class="ic">⚙</span>系统设置</a>
    </nav>
    <div class="side-foot">
      <span class="ver">v2.1.0</span>
      <span class="be"><span class="be-dot" id="beDot"></span><span id="beTxt">后端连接中…</span></span>
      <a class="logout" href="/logout">退出登录</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘</h1>
      <div class="user"><span>admin@internal</span><span class="avatar">A</span></div>
    </div>
    <div class="content">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>

{% block scripts %}{% endblock %}
<script>
(function(){
  var _p = location.pathname;
  function applyActive(){
    var act = null;
    document.querySelectorAll('.side .nav1').forEach(function(a){
      var p = a.dataset.path; if(!p) return;
      var on = (p==='/' ? _p==='/' : _p.indexOf(p)===0);
      a.classList.toggle('active', on);
      if(on) act = a;
    });
    var g = document.getElementById('navClusterGroup'), s = document.getElementById('clusterSub');
    if(g && s && _p.indexOf('/clusters')===0){
      g.classList.add('open');
      var g1 = g.querySelector('.nav1'); if(g1) g1.classList.add('open');
      s.classList.add('show');
    }
    var t = document.getElementById('pageTitle');
    if(act && t){ t.textContent = act.textContent.replace('▶','').trim(); }
  }
  applyActive();

  window.toggleCluster = function(e){
    if(e){ e.stopPropagation(); e.preventDefault(); }
    var g = document.getElementById('navClusterGroup'), s = document.getElementById('clusterSub');
    if(g){ g.classList.toggle('open'); var g1 = g.querySelector('.nav1'); if(g1) g1.classList.toggle('open'); }
    if(s) s.classList.toggle('show');
  };

  // 后端连通性指示
  function pingBackend(){
    var dot = document.getElementById('beDot'), txt = document.getElementById('beTxt');
    if(!dot) return;
    fetch('/api/status', {cache:'no-store'}).then(function(r){ return r.ok; }).then(function(ok){
      dot.className = 'be-dot ' + (ok?'on':'off');
      txt.textContent = ok ? '后端已连接' : '后端异常';
    }).catch(function(){
      dot.className = 'be-dot off'; txt.textContent = '后端异常';
    });
  }
  pingBackend();

  // 集群子菜单（来自真实集群列表）
  function loadClusterSub(){
    var s = document.getElementById('clusterSub'); if(!s) return;
    fetch('/api/status', {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      var cs = (d && d.clusters) || [];
      if(!cs.length){ s.innerHTML = '<a class="empty">（暂无集群）</a>'; return; }
      s.innerHTML = cs.map(function(c){
        var name = c.name || c.cluster_id || c.id || 'cluster';
        return '<a href="/clusters">'+name+'</a>';
      }).join('');
    }).catch(function(){ s.innerHTML = ''; });
  }
  loadClusterSub();
})();
</script>
</body>
</html>
