<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MySQL HA 管理{% endblock %}</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f5f6f8;color:#222}
  header{background:#1f2a44;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff;text-decoration:none;margin-left:14px;font-size:14px}
  main{padding:20px;max-width:1100px;margin:0 auto}
  .card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{margin-top:0;font-size:18px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee}
  .up{color:#1a7f37;font-weight:600}.down{color:#cf222e;font-weight:600}
  .master{background:#e6f4ea}.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
  .btn{display:inline-block;padding:8px 14px;background:#1f2a44;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
  .btn.danger{background:#cf222e}.btn.small{padding:5px 10px;font-size:13px}
  label{display:block;margin:10px 0 4px;font-size:13px;color:#555}
  input,textarea,select{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
  textarea{height:90px;font-family:monospace}
  .msg{background:#fff8e6;border:1px solid #f0d58c;padding:10px 14px;border-radius:6px;margin-bottom:14px}
  .err{background:#fde8e8;border:1px solid #f5b5b5}
  .page-title{margin-top:0;font-size:22px}
  .hint{color:#666;font-size:13px;line-height:1.6;background:#f0f4f8;border-left:3px solid #1f2a44;padding:8px 12px;border-radius:4px;margin:8px 0 4px}
  .kv{margin:8px 0 0;padding-left:20px}
  .kv li{margin:2px 0;font-size:13px}
  .kv code{background:#eee;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div><b>MySQL HA 管理器</b> {% if current %}<span style="font-weight:400;opacity:.8">· 当前主库 {{ current[0] }}:{{ current[1] }}</span>{% endif %}</div>
  <nav>
    <a href="/">拓扑</a>
    <a href="/nodes">节点配置</a>
    <a href="/settings">服务端配置</a>
    <a href="/logout">退出</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
