{% extends "base.html" %}
{% block title %}邮件配置 · MySQL HA 管理器{% endblock %}
{% block content %}
<style>
  .set-section { margin-bottom:18px; }
  .status-msg { font-size:14px; font-weight:600; margin-top:10px; min-height:20px; }
  .status-msg.ok { color:#16a34a; }
  .status-msg.err { color:#ef4444; }
  .pwd-hint { font-size:12px; color:#9ca3af; margin-top:4px; }
</style>

<h1>邮件配置</h1>
<p class="muted">配置 SMTP 邮件告警（主库切换、节点离线、复制中断等会发送通知），并可在此修改管理员登录密码。</p>

{% if error %}<div class="banner err">⚠ <div>{{ error }}</div></div>{% endif %}
{% if msg %}<div class="banner ok">✓ <div>{{ msg }}</div></div>{% endif %}

<!-- 邮件告警配置 -->
<div class="card set-section">
  <h3>邮件告警（SMTP）</h3>
  <form id="settingsForm" class="grid2" onsubmit="return false;">
    <label>SMTP 服务器<input name="smtp_host" value="{{ smtp_host }}" placeholder="smtp.example.com"></label>
    <label>端口<input name="smtp_port" value="{{ smtp_port }}" placeholder="465 / 587"></label>
    <label>发件账号<input name="smtp_user" value="{{ smtp_user }}" placeholder="alert@example.com"></label>
    <label>发件密码<input name="smtp_pass" type="password" placeholder="留空表示不修改"></label>
    <label style="grid-column:1/-1;">告警接收邮箱<input name="alert_email" value="{{ alert_email }}" placeholder="dba@example.com"></label>
  </form>
  <div style="display:flex; gap:10px; margin-top:12px;">
    <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    <button class="btn btn-accent" onclick="testEmail()">发送测试邮件</button>
  </div>
  <div id="saveMsg" class="status-msg"></div>
  <div id="testMsg" class="status-msg"></div>
</div>

<!-- 修改管理员密码 -->
<div class="card set-section">
  <h3>修改管理员密码</h3>
  <form method="post" action="/change_password" class="grid2" onsubmit="return confirmChange(this)">
    <label>当前密码<input type="password" name="old_pwd" required></label>
    <label>新密码<input type="password" name="new_pwd" required minlength="6"></label>
    <label style="grid-column:1/-1;">确认新密码<input type="password" name="new_pwd2" required minlength="6"></label>
  </form>
  <div class="pwd-hint" style="margin-top:8px;">密码长度至少 6 位；修改后请使用新密码登录。</div>
</div>

<script>
  function saveSettings() {
    var f = document.getElementById("settingsForm");
    var fd = new FormData(f);
    fetch("/settings", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = document.getElementById("saveMsg");
        el.className = "status-msg " + (d.ok ? "ok" : "err");
        el.textContent = d.msg || (d.ok ? "已保存" : "保存失败");
      })
      .catch(function (e) {
        var el = document.getElementById("saveMsg");
        el.className = "status-msg err";
        el.textContent = "请求失败：" + e;
      });
  }
  function testEmail() {
    var el = document.getElementById("testMsg");
    el.className = "status-msg";
    el.textContent = "正在发送…";
    fetch("/settings/test_email", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        el.className = "status-msg " + (d.ok ? "ok" : "err");
        el.textContent = d.msg || (d.ok ? "✓ 发送成功" : "✗ 发送失败");
      })
      .catch(function (e) {
        el.className = "status-msg err";
        el.textContent = "请求失败：" + e;
      });
  }
  function confirmChange(form) {
    var p1 = form.new_pwd.value, p2 = form.new_pwd2.value;
    if (p1 !== p2) { alert("两次输入的新密码不一致"); return false; }
    return confirm("确认修改管理员密码？");
  }
</script>
{% endblock %}
