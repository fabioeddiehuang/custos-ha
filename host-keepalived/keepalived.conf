# 可直接使用的 keepalived 配置（示例值：本机 192.168.1.203 / 对端 192.168.1.177）
# 宿主机直装方式（见 README 7.3）：cp 本文件到 /etc/keepalived/keepalived.conf 后按需修改。
# 两台主机用同一份，仅 unicast_src_ip 与 peer 互换。
global_defs {
    router_id ha_mysql_203
    enable_script_security
}

vrrp_script chk_mysql_master {
    script "/etc/keepalived/check_mysql_master.sh"
    interval 2
    fall 2
    rise 2
    user root
}

vrrp_instance VI_MYSQL {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    nopreempt
    advert_int 1
    unicast_src_ip 192.168.1.203
    unicast_peer {
        192.168.1.177
    }
    track_script {
        chk_mysql_master
    }
    virtual_ipaddress {
        192.168.1.10/24
    }
}
