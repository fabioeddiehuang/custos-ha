# 手动部署节点：MySQL 8.0 + keepalived 合一（与「管理端→添加节点」生成的 compose 结构一致）
#
# 用法（二选一）：
#  A) 直接 export 变量后启动：
#     export NODE_IP=192.168.1.203 NODE_PORT=3307 ROOT_PASS='xxx' SERVER_ID=1 \
#            PEER_IP=192.168.1.177 VIP=192.168.1.10 INTERFACE=eth0 VRID=51 \
#            HA_USER=ha_monitor HA_PASS='xxx' MGMT_HOST=192.168.1.50 MGMT_PASS='mgmt_pass'
#     docker compose up -d
#  B) 把变量写入 .env 后 `docker compose up -d`
#
# 注意：keepalived 必须 host 网络 + NET_ADMIN；先渲染配置：
#     envsubst < keepalived/keepalived.conf.template > keepalived/keepalived.conf
#     envsubst < keepalived/ha_check.conf.template > keepalived/ha_check.conf
#     envsubst < init.sql.template > init.sql
services:
  mysql:
    image: mysql:8.0
    container_name: ${NODE_NAME:-mysql-ha-node}
    environment:
      MYSQL_ROOT_PASSWORD: "${ROOT_PASS}"
    command:
      - --server-id=${SERVER_ID:-1}
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-slave-updates=ON
      - --read-only=${READ_ONLY:-ON}
    ports:
      - "${NODE_PORT:-3307}:3306"
    volumes:
      # MySQL 数据目录：统一落在节点目录内的 ./MySQL-data（自包含，可直接拷到 /home/docker/<ip>/ 运行，不越级）
      - ./MySQL-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${ROOT_PASS}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keepalived:
    build: ./keepalived
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - mysql
    volumes:
      - ./keepalived/keepalived.conf:/etc/keepalived/keepalived.conf:ro
      - ./keepalived/check_mysql_master.sh:/etc/keepalived/check_mysql_master.sh:ro
      - ./keepalived/ha_check.conf:/etc/keepalived/ha_check.conf:ro
