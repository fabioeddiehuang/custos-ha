<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Custos Logo 选型 · 14 版对比</title>
<style>
  :root{
    --bg:#0c1116; --panel:#121a22; --ink:#e6edf3; --muted:#8b98a5;
    --line:#243240; --accent:#22d3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft Yahei",sans-serif;
       background:var(--bg);color:var(--ink);padding:32px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
  .card .head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .card .head .num{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#0ABAB5);
       color:#04121a;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .card .head .title{font-size:14px;font-weight:600}
  .swatch{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .swatch .cell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .swatch .light{background:#f4f7fa}
  .swatch .dark{background:#0a0e12}
  .swatch .cell .cap{font-size:11px;color:#7a8694}
  .swatch .light .cap{color:#6b7785}
  svg.lg{width:88px;height:88px;display:block}
  .lockup{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:#0e151c}
  .lockup svg{width:34px;height:34px;flex:none}
  .lockup .wm{font-size:18px;font-weight:700;letter-spacing:.5px}
  .lockup .wm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  .note{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7;
        border:1px dashed var(--line);border-radius:12px;padding:14px 18px}
  code{background:#1b2530;padding:1px 6px;border-radius:5px;color:#9fe9f5}
</style>
</head>
<body>
  <h1>Custos Logo 选型画廊</h1>
  <div class="sub">14 版方案 · 浅色 / 深色双背景下预览 · 选型后删除不中意的 symbol 与渐变即可</div>

  <div class="grid" id="grid"></div>

  <div class="note">
    当前默认 = <b>4 号（盾牌 + 字母 C）</b>。<br/>
    登录页左下角实时切换器可一键预览；内页侧边栏与登录页共用 <code>localStorage</code> 记忆选型。<br/>
    1–4 沿用品牌青（盾牌系）；5–14 为新增彩色 / 非盾牌方案，内纹一律使用彩色高光（白 / 浅色调），不再用近黑墨色。
  </div>

    <symbol id="cs-logo-6" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.6" fill="url(#cs-g6)"/><g fill="#FFF7ED"><rect x="8.2" y="17.4" width="3.1" height="6.6" rx="1.55"/><rect x="13.1" y="13.2" width="3.1" height="10.8" rx="1.55"/><rect x="18.0" y="9.4" width="3.1" height="14.6" rx="1.55"/><rect x="22.9" y="15.2" width="3.1" height="8.8" rx="1.55" opacity=".78"/></g></symbol>

<script>
  const NAMES = {
    1:"盾牌 · 单盘（品牌青）", 2:"盾牌 · 双层盘（品牌青）", 3:"盾牌 · 守护环（品牌青）", 4:"盾牌 · 字母 C（品牌青）",
    5:"六边形 · 数据库（青绿）", 6:"圆徽章 · 数据柱（琥珀橙）", 7:"菱形 · 数据库（靛蓝紫）", 8:"轨道环（天蓝）",
    9:"四叶风车（翡翠绿）", 10:"心跳脉冲（玫红）", 11:"等距立方（暖橙）", 12:"无限符号（青 → 梅紫）",
    13:"循环同步箭头（紫罗兰 → 青）", 14:"守护之星（金琥珀）"
  };
  const grid = document.getElementById('grid');
  for (let i=1;i<=14;i++){
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div class="head">
        <div class="num">${i}</div>
        <div class="title">${NAMES[i]}</div>
      </div>
      <div class="swatch">
        <div class="cell light"><svg class="lg" viewBox="0 0 32 32"><use href="#cs-logo-${i}"/></svg><span class="cap">浅色背景</span></div>
        <div class="cell dark"><svg class="lg" viewBox="0 0 32 32"><use href="#cs-logo-${i}"/></svg><span class="cap">深色背景</span></div>
      </div>
      <div class="lockup">
        <svg viewBox="0 0 32 32"><use href="#cs-logo-${i}"/></svg>
        <div class="wm">Custos<small>HA Manager</small></div>
      </div>`;
    grid.appendChild(card);
  }
</script>
</body>
</html>
