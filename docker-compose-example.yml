# Custos —— docker-compose 模板（脱敏示例）
#
# 用法：复制本文件为 docker-compose.yml 后再按需修改
#   cp docker-compose-example.yml docker-compose.yml
#
# 部署前请将下列「示例 IP」替换为你的真实网络地址（三者应互不相同）：
#   MANAGER_PUBLIC_IP  → 运行 docker 的管理器服务端内网 IP（节点看到的连接来源）
#   MGMT_MYSQL_HOST    → 独立/外部管理库主机 IP（仅管理器自身存储，非集群节点）
#   VIP                → 与节点同网段、当前空闲的虚拟 IP
#
# 示例 IP 取自 RFC 5737 文档保留段 192.0.2.0/24 —— 仅占位、不可直连，
# 部署时必须替换，否则管理器连不上管理库 / 节点。
#
# 口令均为占位符（change_me / 留空），部署前请一并替换为强口令。

services:
  # ============================================================
  # 管理 MySQL（可选，默认关闭）
  # 推荐：使用你已有的「独立 / 外部管理 MySQL」，只需在下方 custos
  # 的 environment 里填好 MGMT_MYSQL_* 即可，无需启动本服务。
  # 若想让管理器自带一个管理库做演示，取消下面整段注释，并取消
  # custos 的 depends_on 注释即可（数据落在项目根下的 ./data/mysql-data）。
  # ------------------------------------------------------------
  # mgmt-mysql:
  #   image: mysql:8.0
  #   environment:
  #     MYSQL_ROOT_PASSWORD: change_me
  #     MYSQL_DATABASE: ha
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./data/mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange_me"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Custos（单容器：决策器 + Web + 节点一键部署生成）
  custos:
    # 容器名固定为 custos（不随仓库目录名变化）；镜像标签用语义化版本号。
    # 版本单一来源 = app/VERSION，本文件【不写死版本号】，升版时无需改动本文件。
    # 构建/部署统一用 ./deploy.sh（或 make build）：它会自动把 app/VERSION 同步到
    # .env 再调用 docker compose，保证镜像标签与页面显示版本始终一致。
    #   ./deploy.sh               # 等价于 docker compose up -d --build
    #   ./deploy.sh logs -f       # 其余参数原样透传给 docker compose
    # 若直接跑 docker compose 且 .env 的 VERSION 与 app/VERSION 不一致，
    # 构建会主动失败并提示改用 ./deploy.sh（防止「标签旧、内容新」错配）。
    container_name: custos
    image: custos:${VERSION:?请先执行./deploy.sh}
    build:
      context: .
      args:
        VERSION: ${VERSION}
    restart: always
    # 若启用上面的 mgmt-mysql，取消下一行注释
    # depends_on:
    #   - mgmt-mysql
    environment:
      # ===== 管理库连接（指向你的独立 / 外部管理 MySQL）=====
      # 重要：必须填外部库真实可达 IP，不要写 auto 或 127.0.0.1。
      #   - auto 会探测本机 IP，而本机通常没跑 MySQL，会导致「添加节点」时
      #     生成的节点连错管理库地址。
      #   - 若管理库与本管理器同机，填该机对外 IP（非 127.0.0.1）。
      # ⚠ 管理库只供「管理器自身存储」使用，绝不作为集群节点，也不写入任何节点部署配置。
      #   业务通信仅发生在「管理器服务端后台 IP」与「各节点」之间，管理库不在其列。
      MGMT_MYSQL_HOST: "192.0.2.20"   # 管理库主机 IP（示例，部署前替换）
      MGMT_MYSQL_PORT: "3306"
      MGMT_MYSQL_USER: "ha"
      MGMT_MYSQL_PASS: "change_me"    # 占位口令，部署前替换；含特殊字符请用引号包裹
      MGMT_MYSQL_DB:   "ha"
      # 全站统一中国时间（Asia/Shanghai = UTC+8）：影响备份时间戳、运行日志、页面时间
      TZ: "Asia/Shanghai"
      WEB_PORT: 28888
      WEB_USER: admin
      WEB_PASS: ""   # 留空=首次启动随机生成并打印到日志；填写=固定密码（生产务必修改）
      CHECK_INTERVAL: 3
      FAIL_THRESHOLD: 2
      NODES_DIR: /app/generated_nodes
      # 节点目录在宿主机上的「显示路径」（Web 展示用）。默认值按仓库目录名 custos-ha
      # 推导；若放在别的目录名，请显式填成 <你的目录名>/generated_nodes。
      NODES_HOST_BASE: "custos-ha/generated_nodes"
      # VIP / 网络（供「添加节点」生成的 compose 使用；网卡/VRID 有默认值，VIP 必填）
      # VIP 注意：需为节点同网段、当前空闲的 IP；系统无法自动探测，必须填写。
      #   可在下方设置，或在 Web「集群管理」中填写（留空则添加节点时报错提示）。
      # VIP: "192.0.2.30"
      VIP_PREFIX: "24"
      # 管理器对外 IP（裸机节点实际看到的【连接来源 IP】，即跑 docker 那台机器的内网 IP）。
      # 这是「服务端后台（管理器应用）」的 IP —— 节点只允许该 IP 连入；
      # 它与「管理后台 MySQL（MGMT_MYSQL_HOST）」是**两回事**：
      # 管理库仅供管理器自身存储，绝不参与集群、也不进节点配置。
      # 节点 ha_check.conf 的 MANAGER_IP、Install 的 root@'<IP>' 授权均对齐此值。
      # 若你的服务端后台 IP 不同，请改为实际值；切勿填成管理库地址。
      MANAGER_PUBLIC_IP: "192.0.2.10"
      INTERFACE: eth0
      VRID: "51"
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / ALERT_EMAIL
    ports:
      - "28888:28888"
    volumes:
      # 持久化「添加节点」生成的部署文件，便于到目标主机 docker compose up。
      # 统一收敛到项目根下的 ./generated_nodes（每个 <ip> 为自包含部署单元，可直接拷到 /home/docker/<ip>/）。
      - ./generated_nodes:/app/generated_nodes
      # 持久化「集群备份」产物：逻辑备份 SQL（gzip）落在项目根 ./backups/<集群名称>/ 下，
      # 容器重建不丢失。备份/恢复均为纯 Python 实现，容器内无需 mysqldump / mysql 客户端。
      - ./backups:/app/backups
      # 挂载宿主 docker.sock：使管理器能读取兄弟容器（keepalived / monitor 等）日志。
      # 无需在镜像内安装 docker CLI，直接经 Unix Socket 调 Docker HTTP API。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ha_net

# 固定管理器网络子网，使 c/s 同机时源 IP(172.28.0.1) 稳定，
# 节点 root@'172.28.%' 双白名单不再随 docker 默认网段漂移失效。
networks:
  ha_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
