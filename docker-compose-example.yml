# Custos —— docker-compose 模板（脱敏示例）
#
# 用法：复制本文件为 docker-compose.yml 后再按需修改
#   cp docker-compose-example.yml docker-compose.yml
#
# 部署前请将下列「示例 IP」替换为你的真实网络地址（三者应互不相同）：
#   MANAGER_PUBLIC_IP  → 运行 docker 的管理器服务端内网 IP（节点看到的连接来源）
#   MGMT_MYSQL_HOST    → 独立/外部管理库主机 IP（仅管理器自身存储，非集群节点）
#   VIP                → 与节点同网段、当前空闲的虚拟 IP
#
# 示例 IP 取自 RFC 5737 文档保留段 192.0.2.0/24 —— 仅占位、不可直连，
# 部署时必须替换，否则管理器连不上管理库 / 节点。
#
# 口令均为占位符（change_me / 留空），部署前请一并替换为强口令。

services:
  # ============================================================
  # 管理 MySQL（可选，默认关闭）
  # 推荐：使用你已有的「独立 / 外部管理 MySQL」，只需在下方 custos
  # 的 environment 里填好 MGMT_MYSQL_* 即可，无需启动本服务。
  # 若想让管理器自带一个管理库做演示，取消下面整段注释，并取消
  # custos 的 depends_on 注释即可（数据落在项目根下的 ./data/mysql-data）。
  # 更省事：sudo sh install.sh --with-db 会自动完成上述「取消注释 + 写入口令 + 同网 + depends_on 健康条件」。
  # ------------------------------------------------------------
  # mgmt-mysql:
  #   image: mysql:8.0
  #   environment:
  #     MYSQL_ROOT_PASSWORD: change_me
  #     MYSQL_DATABASE: ha
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./data/mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Custos（单容器：决策器 + Web + 节点一键部署生成）
  custos-server:
    # 容器名固定为 custos-server（服务端镜像/容器统一命名）；镜像标签用语义化版本号。
    # 版本单一来源 = .env 的 VERSION=（升版只改这一处），本文件【不写死版本号】。
    # 构建/部署统一用 ./scripts/deploy.sh（或 make build）：它读 .env 的 VERSION 调用
    # docker compose，保证镜像标签与页面显示版本始终一致。
    #   ./scripts/deploy.sh               # 等价于 docker compose up -d --build
    #   ./scripts/deploy.sh logs -f       # 其余参数原样透传给 docker compose
    container_name: custos-server
    image: custos-server:${VERSION:?请先执行./scripts/deploy.sh}
    build:
      context: .
      args:
        VERSION: ${VERSION}
    restart: always
    # 若启用上面的 mgmt-mysql，取消下一行注释
    # depends_on:
    #   - mgmt-mysql
    environment:
      # 版本号：由 .env 的 VERSION= 注入。应用内 config.APP_VERSION 直接读该环境变量，
      # 故镜像内无需 .env 文件（.dockerignore 已排除 .env，避免 SECRET_KEY 等敏感值入镜像）。
      VERSION: ${VERSION}
      # ===== 管理库连接（指向你的独立 / 外部管理 MySQL）=====
      # 重要：必须填外部库真实可达 IP，不要写 auto 或 127.0.0.1。
      #   - auto 会探测本机 IP，而本机通常没跑 MySQL，会导致「添加节点」时
      #     生成的节点连错管理库地址。
      #   - 若管理库与本管理器同机，填该机对外 IP（非 127.0.0.1）。
      # ⚠ 管理库只供「管理器自身存储」使用，绝不作为集群节点，也不写入任何节点部署配置。
      #   业务通信仅发生在「管理器服务端后台 IP」与「各节点」之间，管理库不在其列。
      MGMT_MYSQL_HOST: "192.0.2.20"   # 管理库主机 IP（示例，部署前替换）
      MGMT_MYSQL_PORT: "3306"
      MGMT_MYSQL_USER: "ha"
      MGMT_MYSQL_PASS: "change_me"    # 占位口令，部署前替换；含特殊字符请用引号包裹
      MGMT_MYSQL_DB:   "ha"
      # 全站统一中国时间（Asia/Shanghai = UTC+8）：影响备份时间戳、运行日志、页面时间
      TZ: "Asia/Shanghai"
      WEB_PORT: 28888
      WEB_USER: admin
      WEB_PASS: ""   # 留空=首次启动随机生成并打印到日志；填写=固定密码（生产务必修改）
      SECRET_KEY: "${SECRET_KEY}"   # 留空（不在 .env 设置）则首次启动自动生成随机密钥并持久化到 ./data/secret_key；或在 .env 设置 SECRET_KEY=<强随机值> 固定
      # 管理库凭证（root/ha/repl/app 口令）静态加密开关：
      #   "off"（默认）—— 明文落库，**完全不依赖任何密钥**，SECRET_KEY 变动 / 重装 / 重建镜像
      #                   都不会再导致存量凭证失效（v2.3.10 起默认，推荐）。
      #   "on"          —— 加密存储。密钥自动持久化在 ./data/cred.key（不随 SECRET_KEY 变化），
      #                   且解密走「钥匙串」多候选回退（CRED_KEY / cred.key / SECRET_KEY 派生），
      #                   单一来源失效不会让存量凭证集体解不开。
      CRED_ENCRYPTION: "off"
      SEMI_SYNC: "1"   # 半同步复制开关：默认 "1" 启用（主库提交等待从库 ACK，压缩切换数据丢失窗口）；需节点插件可用
      CHECK_INTERVAL: 3
      FAIL_THRESHOLD: 2
      FAILOVER_COOLDOWN_SEC: 120   # 两次切换最小间隔(秒)；仅约束手动切换与「延迟/压力」自动切换，不影响主库失联的紧急切换
      NODES_DIR: /app/generated_nodes
      # 节点目录在宿主机上的「显示路径」（Web 展示用）。默认值按仓库目录名 custos-ha
      # 推导；若放在别的目录名，请显式填成 <你的目录名>/generated_nodes。
      NODES_HOST_BASE: "custos-ha/generated_nodes"
      # VIP / 网络（供「添加节点」生成的 compose 使用；网卡/VRID 有默认值，VIP 必填）
      # VIP 注意：需为节点同网段、当前空闲的 IP；系统无法自动探测，必须填写。
      #   可在下方设置，或在 Web「集群管理」中填写（留空则添加节点时报错提示）。
      # VIP: "192.0.2.30"
      VIP_PREFIX: "24"
      # 管理器对外 IP（裸机节点实际看到的【连接来源 IP】，即跑 docker 那台机器的内网 IP）。
      # 这是「服务端后台（管理器应用）」的 IP —— 节点只允许该 IP 连入；
      # 它与「管理后台 MySQL（MGMT_MYSQL_HOST）」是**两回事**：
      # 管理库仅供管理器自身存储，绝不参与集群、也不进节点配置。
      # 节点 ha_check.conf 的 MANAGER_IP、Install 的 root@'<IP>' 授权均对齐此值。
      # 若你的服务端后台 IP 不同，请改为实际值；切勿填成管理库地址。
      MANAGER_PUBLIC_IP: "192.0.2.10"
      INTERFACE: eth0
      VRID: "51"
      # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / ALERT_EMAIL
    ports:
      # 端口映射必须跟随 WEB_PORT：此前写死 "28888:28888"，而应用监听的是 WEB_PORT
      # （config.WEB_PORT = env("WEB_PORT", 28888)）。安装时一旦改了端口（如 8080），
      # 容器内监听 8080、映射却是 28888:28888 → 宿主 28888 转不到应用、8080 又未映射，
      # 结果 Web 完全打不开，且安装脚本还按 WEB_PORT 打印了错误的访问地址。
      # ${WEB_PORT:-28888} 由 .env 的 WEB_PORT 注入（install.sh 会写入），缺省回落 28888。
      - "${WEB_PORT:-28888}:${WEB_PORT:-28888}"
    volumes:
      # 持久化「添加节点」生成的部署文件，便于到目标主机 docker compose up。
      # 统一收敛到项目根下的 ./generated_nodes（每个 <ip> 为自包含部署单元，可直接拷到 /home/docker/<ip>/）。
      - ./generated_nodes:/app/generated_nodes
      # 持久化「集群备份」产物：逻辑备份 SQL（gzip）落在项目根 ./backups/<集群名称>/ 下，
      # 容器重建不丢失。备份/恢复均为纯 Python 实现，容器内无需 mysqldump / mysql 客户端。
      - ./backups:/app/backups
      # 持久化管理器自身状态（含自动生成的 SECRET_KEY），容器重建不丢失会话
      - ./data:/app/data
      # 挂载宿主 docker.sock：使管理器能读取兄弟容器（keepalived / monitor 等）日志。
      # 无需在镜像内安装 docker CLI，直接经 Unix Socket 调 Docker HTTP API。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ha_net

# 固定管理器网络子网，使 c/s 同机时源 IP(172.28.0.1) 稳定，
# 节点 root@'172.28.%' 双白名单不再随 docker 默认网段漂移失效。
networks:
  ha_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
